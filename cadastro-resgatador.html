<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodShare - Cadastro Resgatador</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="foodshare.css">
</head>
<body class="login-body">

  <header class="header">
    <div class="header-container">
      <div class="back-row" style="margin-bottom: 0;">
        <button class="back-btn" onclick="window.history.back()" aria-label="Voltar">
          <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="screen-title">Voltar</span>
      </div>
    </div>
  </header>

  <main class="login-main">
    <div class="register-form-card">
      <h2>Cadastro de Resgatador 👤</h2>
      <p>Preencha os dados abaixo para criar sua conta e começar a resgatar alimentos.</p>

      <form id="resgatador-form" novalidate>
        
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" class="form-input" placeholder="Ex: João da Silva" required>
          <span class="error-msg" id="error-nome">Por favor, insira seu nome completo.</span>
        </div>

        <div class="form-row">
          <div class="form-group form-col">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" class="form-input" placeholder="000.000.000-00" maxlength="14" required>
            <span class="error-msg" id="error-cpf">CPF inválido.</span>
          </div>

          <div class="form-group form-col">
            <label for="telefone">Telefone (WhatsApp)</label>
            <input type="text" id="telefone" class="form-input" placeholder="(00) 00000-0000" maxlength="15" required>
            <span class="error-msg" id="error-telefone">Telefone inválido.</span>
          </div>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-input" placeholder="seuemail@exemplo.com" required>
          <span class="error-msg" id="error-email">Insira um e-mail válido.</span>
        </div>

        <div class="form-row">
          <div class="form-group form-col">
            <label for="senha">Senha</label>
            <input type="password" id="senha" class="form-input" placeholder="Mínimo 6 caracteres" required>
            <span class="error-msg" id="error-senha">A senha deve ter pelo menos 6 caracteres.</span>
          </div>

          <div class="form-group form-col">
            <label for="confirma-senha">Confirmar Senha</label>
            <input type="password" id="confirma-senha" class="form-input" placeholder="Repita a senha" required>
            <span class="error-msg" id="error-confirma">As senhas não coincidem.</span>
          </div>
        </div>

        <button type="submit" class="auth-btn submit-btn">Concluir Cadastro</button>
      </form>

    </div>
  </main>

  <!-- Chama o arquivo JavaScript externo -->
  <script src="cadastro-resgatador.js"></script>
</body>
</html>
