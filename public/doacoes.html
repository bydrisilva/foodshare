<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3d1a0e">
  <title>FoodShare - Doações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/foodshare.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="header-top">
        <div class="back-row">
          <a class="back-btn" href="index.html" aria-label="Voltar para o início">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          </a>
          <span class="screen-title">Explorar doações</span>
        </div>
        <a href="gerenciar-doacoes.html" class="icon-btn" aria-label="Cadastrar doação">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </a>
      </div>

      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0z"/></svg>
          <input id="busca-doacoes" type="search" placeholder="Buscar alimento, doador ou endereço" aria-label="Buscar doações">
        </div>
        <button id="botao-filtrar" class="filter-btn" type="button" aria-label="Aplicar filtro">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </button>
      </div>

      <nav class="cats" aria-label="Categorias de alimentos">
        <a href="doacoes.html" class="cat-pill">Todos</a>
        <a href="doacoes.html?categoria=LANCHE" class="cat-pill">🥪 Lanche</a>
        <a href="doacoes.html?categoria=ALMOCO" class="cat-pill">🍽️ Almoço</a>
        <a href="doacoes.html?categoria=JANTAR" class="cat-pill">🌙 Jantar</a>
        <a href="doacoes.html?categoria=OUTRO" class="cat-pill">🥦 Outros</a>
      </nav>
    </div>
  </header>

  <main class="content">
    <section class="category-hero">
      <div id="icone-categoria" class="category-hero-icon">🍱</div>
      <div>
        <h1 id="titulo-categoria" class="category-hero-title">Todos os alimentos</h1>
        <p id="texto-categoria" class="category-hero-sub">Consulte as doações cadastradas no FoodShare.</p>
      </div>
    </section>

    <div class="filters">
      <div></div>
      <select id="status-doacoes" class="form-select" aria-label="Filtrar por status">
        <option value="DISPONIVEL">Disponíveis</option>
        <option value="">Todos os status</option>
        <option value="RESERVADA">Reservadas</option>
        <option value="RESGATADA">Resgatadas</option>
      </select>
    </div>

    <section id="grade-doacoes" class="food-grid" aria-live="polite"></section>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span>Início</span>
    </a>
    <a href="doacoes.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg><span>Explorar</span>
    </a>
    <a href="meu-pedido.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18"/></svg><span>Pedido</span>
    </a>
    <a href="login.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/doacoes.js"></script>
</body>
</html>
