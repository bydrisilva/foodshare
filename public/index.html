<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3d1a0e">
  <meta name="description" content="FoodShare conecta pessoas e estabelecimentos que doam alimentos a pessoas que podem resgatá-los.">
  <title>FoodShare - Início</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/foodshare.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="header-top">
        <a href="index.html" aria-label="Página inicial do FoodShare">
          <img class="logo-img" src="imagens/food-share-logo.svg" alt="FoodShare">
        </a>

        <div class="header-actions">
          <a class="icon-btn" href="gerenciar-doacoes.html" aria-label="Cadastrar doação" title="Cadastrar doação">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </a>
          <a class="icon-btn" href="meu-pedido.html" aria-label="Meu pedido" title="Meu pedido">
            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
          </a>
        </div>
      </div>

      <div class="location-label">Região do projeto:</div>
      <div class="location-name">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
        Samambaia, Distrito Federal
      </div>

      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0z"/></svg>
          <input id="busca-home" type="search" placeholder="Buscar alimento, doador ou endereço" aria-label="Buscar doações">
        </div>
        <button id="botao-busca-home" class="filter-btn" type="button" aria-label="Realizar busca">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0z"/></svg>
        </button>
      </div>

      <nav class="cats" aria-label="Categorias de alimentos">
        <a href="doacoes.html" class="cat-pill active">Todos</a>
        <a href="doacoes.html?categoria=LANCHE" class="cat-pill">🥪 Lanche</a>
        <a href="doacoes.html?categoria=ALMOCO" class="cat-pill">🍽️ Almoço</a>
        <a href="doacoes.html?categoria=JANTAR" class="cat-pill">🌙 Jantar</a>
        <a href="doacoes.html?categoria=OUTRO" class="cat-pill">🥦 Outros</a>
      </nav>
    </div>
  </header>

  <main class="content">
    <a href="doacoes.html?status=DISPONIVEL" class="banner" aria-label="Ver alimentos para retirada imediata">
      <img src="imagens/resgate-express.svg" alt="Resgate Express">
    </a>

    <div class="section-header">
      <div>
        <h1 class="section-title">Alimentos próximos a você</h1>
        <p class="section-subtitle">As informações abaixo são carregadas do PostgreSQL.</p>
      </div>
      <a class="see-all" href="doacoes.html">Ver todos →</a>
    </div>

    <section id="grade-home" class="food-grid" aria-live="polite"></section>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>Início</span>
    </a>
    <a href="doacoes.html" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <span>Explorar</span>
    </a>
    <a href="meu-pedido.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18"/></svg>
      <span>Pedido</span>
    </a>
    <a href="login.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Perfil</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
